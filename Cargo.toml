[package]
name = "ssbu-quiet-elite-switch"
version = "0.1.0"
edition = "2021"
publish = false
description = "Skyline plugin for Super Smash Bros. Ultimate 13.0.5 that stops the pop-up the Quickplay character select shows when you switch from a fighter in Elite Smash to one that is not"
license = "MIT"

[package.metadata.skyline]
titleid = "01006A800016E000"

[features]
# Eden-only diagnostics (logs each suppressed pop-up); never in the shipped NRO.
diag = []

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Size over speed: the mapped NRO is the game-heap cost (as in the other plugins).
opt-level = "s"
debug = 2
strip = false
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
